name: Build dskcpy

on:
  workflow_dispatch:
  push:
    branches: [master, main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: Ggaem-22/dskcpy

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 15859902
          accept-android-sdk-licenses: true

      - name: Install Android SDK 36
        shell: pwsh
        run: |
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      # 1) APK del companion (esto ya funcionaba en tu log)
      - name: Build Android companion
        shell: pwsh
        run: .\gradlew.bat --no-daemon :server:assembleDebug

      # 2) Entorno MSYS2.
      #    FIX: meson y ninja se instalan DENTRO de MSYS2 (antes se instalaban con pip
      #    en el Python de Windows y MSYS2 no los veia: "meson: command not found").
      #    path-type: inherit deja visibles java/adb de Windows desde el shell de MSYS2.
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          path-type: inherit
          cache: true
          install: >-
            git
            make
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-SDL2_image
            mingw-w64-x86_64-libusb
            mingw-w64-x86_64-ffmpeg
            mingw-w64-x86_64-zlib

      # 3) Host de Windows (scrcpy.exe).
      #    Se reutiliza el APK que ya compilo Gradle como "server prebuilt",
      #    asi meson no tiene que volver a compilar el server con Java.
      - name: Build Windows host
        shell: msys2 {0}
        run: |
          set -e
          export PATH="/mingw64/bin:/usr/bin:$PATH"
          APK=$(ls "$PWD"/server/build/outputs/apk/debug/*.apk | head -1)
          echo "Usando server prebuilt: $APK"
          meson setup x-reverse --buildtype=release -Dprebuilt_server="$APK"
          meson compile -C x-reverse

      # 4) Empaquetar: exe + DLLs de MinGW + server + APK
      - name: Package Windows build
        shell: msys2 {0}
        run: |
          set -e
          mkdir -p dist/windows dist/android
          cp x-reverse/app/scrcpy.exe dist/windows/
          cp x-reverse/server/scrcpy-server dist/windows/ 2>/dev/null || true
          # copiar las DLL de MinGW que necesita el exe
          ldd x-reverse/app/scrcpy.exe | awk '/\/mingw64\//{print $3}' | sort -u | xargs -I{} cp {} dist/windows/
          APK=$(ls "$PWD"/server/build/outputs/apk/debug/*.apk | head -1)
          cp "$APK" dist/android/reverse-display.apk
          cp "$APK" dist/windows/reverse-display.apk
          ls -la dist/windows dist/android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dskcpy-android-apk
          path: dist/android/reverse-display.apk

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: dskcpy-windows
          path: dist/windows/
