name: Compilar dskcpy

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Copiar repositorio
      uses: actions/checkout@v4

    - name: Instalar dependencias y herramientas de compilación
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential meson ninja-build

    - name: Configurar y compilar con Meson
      run: |
        meson setup builddir
        meson compile -C builddir

    - name: Buscar el ejecutable generado
      run: |
        echo "Buscando archivos ejecutables en el directorio de compilación:"
        find builddir -type f -executable

    - name: Subir el binario compilado como artefacto
      uses: actions/upload-artifact@v4
      with:
        name: dskcpy-ejecutable
        path: |
          builddir/dskcpy
          builddir/**/dskcpy
